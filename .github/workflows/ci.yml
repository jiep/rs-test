name: CI

on: 
  push:
  pull_request:

jobs:
  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        
      - name: Lint workflow files
        uses: raven-actions/actionlint@e01d1ea33dd6a5ed517d95b4c0c357560ac6f518 # v2.1.1
  
  build-and-test:
    name: Build, test, and lint code
    runs-on: ubuntu-latest
    needs: lint-workflows
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Check code compilation
        run: cargo check

      - name: Run tests
        run: cargo test
      
      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy -- -D warnings

  deploy:
    name: Create release binaries
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy: 
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            
          - target: aarch64-apple-darwin
            os: macos-latest  # Apple Silicon macOS
    
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ github.ref_name }}
      BASE_BIN_NAME: rs-test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation dependencies (Linux/Windows)
        if: matrix.os == 'ubuntu-latest' && contains(matrix.target, 'windows')
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release binary
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ matrix.target }}"
          BIN_NAME="${BASE_BIN_NAME}"
          VERSIONED_BIN_NAME="${BASE_BIN_NAME}-${VERSION}-${TARGET}"

          if [[ "${TARGET}" == *"windows"* ]]; then
            BIN_NAME="${BIN_NAME}.exe"
            VERSIONED_BIN_NAME="${VERSIONED_BIN_NAME}.exe"
          fi

          if [[ "${{ matrix.os }}" != "macos-latest" ]]; then
            strip "target/${TARGET}/release/${BIN_NAME}"
          fi

          cd "target/${TARGET}/release"
          mv "${BIN_NAME}" "${VERSIONED_BIN_NAME}"

          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            shasum -a 256 "${VERSIONED_BIN_NAME}" | cut -d " " -f 1 > digest.sha256
          else
            sha256sum "${VERSIONED_BIN_NAME}" | cut -d " " -f 1 > digest.sha256
          fi

          zip "../../../${BASE_BIN_NAME}-${VERSION}-${TARGET}.zip" "${VERSIONED_BIN_NAME}" digest.sha256

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: '${{ env.BASE_BIN_NAME }}-${{ env.VERSION }}-${{ matrix.target }}.zip'

      - name: Upload packaged artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.BASE_BIN_NAME }}-${{ env.VERSION }}-${{ matrix.target }}.zip

  publish-release:
    name: Publish immutable release
    runs-on: ubuntu-latest
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
          gh release create "$TAG" release-artifacts/*.zip --repo "$REPO" --generate-notes
